name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm install, not ci: the committed lock is generated on Windows and
      # omits the Linux-side optional deps of @napi-rs/wasm-runtime
      # (@emnapi/core, @emnapi/runtime), which rolldown's wasm binding pulls
      # in — a strict lock check can't be satisfied on both platforms.
      # node-llama-cpp is a devDependency purely so `typecheck` validates the
      # llama-cpp adapter against the real upstream types. Nothing in CI runs
      # local inference — every test drives an injected LlamaRuntime — so skip
      # its postinstall rather than pull a native binary and risk a CMake
      # fallback build on a machine that will never use it.
      - run: npm install
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
          NODE_LLAMA_CPP_POSTINSTALL: skip
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # The Reference shelf replaces the old bare-name API list, so a new export must
      # not silently arrive undocumented. Presence only — this is a "did you forget a
      # page" gate, not a prose reviewer. Reads the built barrel, so it follows build.
      - name: Docs export coverage
        run: node scripts/check-docs-exports.mjs

      # The package is consumed by four sibling repos; a broken exports map
      # or a missing dist/ is a downstream outage, so gate on the tarball.
      - name: Package contents gate
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            const need = ["dist/index.js", "dist/index.d.ts", "package.json", "LICENSE"];
            const missing = need.filter(f => !files.includes(f));
            if (missing.length) throw new Error("tarball missing: " + missing.join(", "));
            const leaked = files.filter(f =>
              f.startsWith("src/") || f.startsWith("test/") ||
              f.startsWith("docs/") || f.startsWith("examples/"));
            if (leaked.length) throw new Error("tarball leaks sources: " + leaked.join(", "));
          '
