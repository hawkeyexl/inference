# Release pipeline (mirrors dockg's / docmeta's). Manual-only until the
# one-time setup is done and a dispatched run has succeeded:
#   1. Install the release GitHub App (the one docmeta uses) on this repo with
#      Contents, Issues and Pull requests read & write, and add its
#      RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY secrets.
#   2. On npmjs.com, add a GitHub Actions trusted publisher for
#      @hawkeyexl/inference: owner hawkeyexl, repo inference, workflow
#      release.yml. npm checks the provenance against package.json's
#      repository.url, so the two must name the same repo.
# semantic-release reads the last release from git tags, so every published
# version needs its v* tag on the remote; without one it computes 1.0.0.
# Then replace `workflow_dispatch` with push triggers for the branches in
# .releaserc.json (main, next, feat/**).
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC trusted publishing to npm + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm install for the same reason as ci.yml (platform-skewed lock).
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
