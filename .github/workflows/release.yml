# Release pipeline (mirrors dockg's / docmeta's). Runs on every push to a
# branch .releaserc.json releases from; workflow_dispatch stays for re-runs.
# Prerequisites, all in place as of 0.3.2:
#   - The release GitHub App is installed here with Contents, Issues and Pull
#     requests read & write; RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are set.
#   - npm trusted publishing for @hawkeyexl/inference names owner hawkeyexl,
#     repo inference, workflow release.yml. npm checks the provenance against
#     package.json's repository.url, so the two must name the same repo.
# semantic-release reads the last release from git tags, so every published
# version needs its v* tag on the remote; without one it computes 1.0.0.
# The release commit carries [skip ci], so it does not re-trigger this file.
name: Release

on:
  push:
    branches:
      - main
      - next
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC trusted publishing to npm + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm install for the same reason as ci.yml (platform-skewed lock).
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
